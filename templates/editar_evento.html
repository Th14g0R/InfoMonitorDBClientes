<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar evento</title>
    <link rel="icon" href="/static/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
    <script src="{{ url_for('static', filename='ui.js') }}" defer></script>
</head>
<body>
<main id="conteudo-principal" class="container" style="max-width: 860px; margin: 32px auto; padding: 0 var(--space-4);">
    <div class="nav-bar">
        <div class="d-flex align-center gap-2">
            <h2 style="margin: 0; font-size: var(--font-size-lg);">✏️ Editar evento</h2>
        </div>
        <div>
            <a href="/horarios#secao-eventos" class="btn btn-secondary">⬅️ Voltar aos Eventos</a>
        </div>
    </div>
    <div class="card edicao-evento-card">
        <form method="POST" class="form-grid evento-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label class="form-label evento-campo-data">Data<input type="date" name="data_evento" required value="{{ evento.data_evento }}" class="form-control"></label>
            <label class="form-label evento-campo-tipo">Tipo
                <select name="tipo" class="form-select">
                    <option value="comum" {% if evento.tipo == 'comum' or not evento.tipo %}selected{% endif %}>📌 Comum / Informativo</option>
                    <option value="feriado_sem_expediente" {% if evento.tipo == 'feriado_sem_expediente' %}selected{% endif %}>🏖️ Feriado (Sem Expediente)</option>
                    <option value="feriado_escala_reduzida" {% if evento.tipo == 'feriado_escala_reduzida' %}selected{% endif %}>⚡ Feriado (Escala Reduzida / Plantão)</option>
                </select>
            </label>
            <label class="form-label evento-campo-nome">Nome<input type="text" name="nome" required maxlength="150" value="{{ evento.nome }}" class="form-control"></label>
            <label class="form-label evento-campo-local">Local<input type="text" name="local" maxlength="200" value="{{ evento.local }}" class="form-control"></label>
            <label class="form-label evento-campo-inicio">Início<input type="time" name="hora_inicio" value="{{ evento.hora_inicio }}" class="form-control"></label>
            <label class="form-label evento-campo-fim">Fim<input type="time" name="hora_fim" value="{{ evento.hora_fim }}" class="form-control"></label>
            <label class="form-label evento-observacao" style="grid-column: 1 / -1;">Observação<textarea name="observacao" maxlength="1000" rows="3" class="form-control">{{ evento.observacao }}</textarea></label>
            <div class="edicao-evento-acoes d-flex gap-2" style="grid-column: 1 / -1; margin-top: var(--space-3);">
                <button type="submit" class="btn btn-primary">Salvar alterações</button>
                <a href="/horarios#secao-eventos" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
